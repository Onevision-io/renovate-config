# gitleaks — secret-scanning gate. Canonical logic lives in the shared reusable workflow;
# this file is a thin pinned caller. Check-run: `gitleaks / gitleaks`.
name: gitleaks
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gitleaks:
    uses: Octet-Public/octet-workflows/.github/workflows/gitleaks.yml@a60c14cb1281d616c27075443aa817b2f9224d00  # v2.17.1
