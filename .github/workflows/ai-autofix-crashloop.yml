name: AI Autofix (crashloop)

on:
  repository_dispatch:
    types: [tracker-error, autofix]

permissions: {}

jobs:
  fix:
    uses: Octet-Public/octet-workflows/.github/workflows/ai-autofix-crashloop.yml@a60c14cb1281d616c27075443aa817b2f9224d00
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Explicit secrets, not `secrets: inherit` (flagged by ai-review: over-broad org-secret
    # exposure to a third-party reusable workflow). The callee only reads these two
    # (Octet-Public/octet-workflows .github/workflows/ai-autofix-crashloop.yml lines 217-218).
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
